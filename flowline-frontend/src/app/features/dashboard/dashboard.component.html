<div class="dashboard-container">
  <header class="topbar">
    <h1>FlowLine</h1>
    <button (click)="logout()">Sair</button>
  </header>

  <main class="content">
    @if (loading) {
      <div class="loading">Carregando...</div>
    }

    @if (!loading && dashboard) {
      <div class="cards">
        <div class="card">
          <span class="label">Total de Ordens</span>
          <span class="value">{{ dashboard.orders.total }}</span>
        </div>
        <div class="card">
          <span class="label">Pendentes</span>
          <span class="value">{{ dashboard.orders.pending }}</span>
        </div>
        <div class="card">
          <span class="label">Entregues Hoje</span>
          <span class="value">{{ dashboard.orders.deliveredToday }}</span>
        </div>
        <div class="card">
          <span class="label">Produtos</span>
          <span class="value">{{ dashboard.totalProducts }}</span>
        </div>
        <div class="card">
          <span class="label">Usuários</span>
          <span class="value">{{ dashboard.totalUsers }}</span>
        </div>
      </div>
    }
  </main>
</div>
